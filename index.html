<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANV Sichtungsübung - 100 Patienten</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-title {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .top-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stammdaten {
            flex: 1;
            min-width: 280px;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
        }

        .stammdaten p {
            margin: 10px 0;
            font-size: 1.05rem;
        }

        .stammdaten strong {
            color: var(--primary-color);
        }

        .body-chart-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }

        .schema-section {
            margin-top: 25px;
        }

        .schema-section h2 {
            background: var(--primary-color);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .interactive-block {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .interactive-block:hover {
            background-color: #edf2f7;
        }

        .block-header {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .block-content {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #cbd5e0;
            color: #2d3748;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: #cbd5e0;
            color: #4a5568;
        }

        .timer-active {
            background: #fefcbf;
            color: #744210;
        }

        .revealed {
            background: #c6f6d5;
            color: #22543d;
        }

        .not-found {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container" id="patient-app"></div>

// Generierung von GENAU 100 individuellen Patienten-Objekten
function build100Patients() {
    const list = {};
    for (let i = 1; i <= 100; i++) {
        const isMale = i % 2 === 0;
        const vorname = isMale ? vornamenM[i % vornamenM.length] : vornamenW[i % vornamenW.length];
        const nachname = nachnamen[(i * 7) % nachnamen.length];
        const alter = (i * 3) % 72 + 6; // Alter 6 bis 78
        
        // Zufallsorientierte aber deterministische Zuordnung aus dem Symptompool
        const baseScenario = symptomPool[(i * 3 + 1) % symptomPool.length];

        // Tiefe Kopie, um Änderungen pro Patient unabhängig zu halten
        list[i] = {
            id: i,
            name: nachname,
            vorname: vorname,
            alter: alter,
            geschlecht: isMale ? "Männlich" : "Weiblich",
            gehfaehig: baseScenario.gehfaehig,
            ansprechbar: baseScenario.ansprechbar,
            verletzungen: baseScenario.verletzungen,
            ersteindruck: baseScenario.ersteindruck,
            markers: baseScenario.markers,
            xabcde: JSON.parse(JSON.stringify(baseScenario.xabcde)),
            sampler: JSON.parse(JSON.stringify(baseScenario.sampler))
        };
    }
    return list;
}

const patientenData = build100Patients();

function getPatientId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id') || '1';
}

function renderPatient() {
    const id = parseInt(getPatientId(), 10);
    const p = patientenData[id];
    const app = document.getElementById('patient-app');

    if (!p) {
        app.innerHTML = `<div class="not-found">Patient mit ID ${id} existiert nicht! (Erlaubt: 1 - 100)</div>`;
        return;
    }

    let html = `
        <h1 class="header-title">MANV-Sichtungsübung | Patient #${p.id} von 100</h1>

        <div class="top-section">
            <div class="stammdaten">
                <p><strong>Name:</strong> ${p.name}</p>
                <p><strong>Vorname:</strong> ${p.vorname}</p>
                <p><strong>Alter:</strong> ${p.alter}</p>
                <p><strong>Geschlecht:</strong> ${p.geschlecht}</p>
                <p><strong>Gehfähig:</strong> ${p.gehfaehig}</p>
                <p><strong>Ansprechbar:</strong> ${p.ansprechbar}</p>
                <p><strong>Offensichtliche Verletzungen:</strong> ${p.verletzungen}</p>
                <p><strong>Ersteindruck:</strong> ${p.ersteindruck}</p>
            </div>

            <div class="body-chart-container">
                <canvas id="bodyCanvas" width="300" height="400"></canvas>
            </div>
        </div>

        <div class="schema-section">
            <h2>x-ABCDE Schema</h2>
            ${renderBlocks(p.xabcde, 'xabcde')}
        </div>

        <div class="schema-section">
            <h2>SAMPLER Schema</h2>
            ${renderBlocks(p.sampler, 'sampler')}
        </div>
    `;

    app.innerHTML = html;
    drawBodyChart(p.markers);
}

function renderBlocks(dataObj, prefix) {
    let result = '';
    let index = 0;
    for (const [key, value] of Object.entries(dataObj)) {
        const blockId = `${prefix}-${index}`;
        result += `
            <div class="interactive-block" onclick="startTimer('${blockId}')">
                <div class="block-header">
                    <span>${key}</span>
                    <span class="status-badge" id="badge-${blockId}">Klicken zum Ermitteln</span>
                </div>
                <div class="block-content" id="content-${blockId}">
                    ${value}
                </div>
            </div>
        `;
        index++;
    }
    return result;
}

const activeTimers = {};

function startTimer(blockId) {
    const content = document.getElementById(`content-${blockId}`);
    const badge = document.getElementById(`badge-${blockId}`);

    if (content.style.display === 'block' || activeTimers[blockId]) {
        return;
    }

    let timeLeft = 10;
    badge.className = 'status-badge timer-active';
    badge.innerText = `Wartezeit: ${timeLeft}s`;

    activeTimers[blockId] = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            badge.innerText = `Wartezeit: ${timeLeft}s`;
        } else {
            clearInterval(activeTimers[blockId]);
            delete activeTimers[blockId];
            badge.className = 'status-badge revealed';
            badge.innerText = 'Ermittelt';
            content.style.display = 'block';
        }
    }, 1000);
}

function drawBodyChart(markers) {
    const canvas = document.getElementById('bodyCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 300, 400);

    drawSilhouette(ctx, 75, "Vorderseite");
    drawSilhouette(ctx, 225, "Rückseite");

    markers.forEach(m => {
        ctx.beginPath();
        ctx.arc(m.x, m.y, 8, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(231, 76, 60, 0.8)";
        ctx.fill();
        ctx.strokeStyle = "#c0392b";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#000";
        ctx.font = "bold 10px Arial";
        ctx.fillText(m.label, m.x + 12, m.y + 4);
    });
}

function drawSilhouette(ctx, centerX, label) {
    ctx.strokeStyle = "#7f8c8d";
    ctx.lineWidth = 2;
    ctx.fillStyle = "#ecf0f1";

    ctx.beginPath();
    ctx.arc(centerX, 40, 15, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(centerX - 4, 55);
    ctx.lineTo(centerX + 4, 55);
    ctx.lineTo(centerX + 25, 70);
    ctx.lineTo(centerX + 35, 150);
    ctx.lineTo(centerX + 25, 150);
    ctx.lineTo(centerX + 15, 90);
    ctx.lineTo(centerX + 15, 180);
    ctx.lineTo(centerX + 20, 320);
    ctx.lineTo(centerX + 5, 320);
    ctx.lineTo(centerX, 190);
    ctx.lineTo(centerX - 5, 320);
    ctx.lineTo(centerX - 20, 320);
    ctx.lineTo(centerX - 15, 180);
    ctx.lineTo(centerX - 15, 90);
    ctx.lineTo(centerX - 25, 150);
    ctx.lineTo(centerX - 35, 150);
    ctx.lineTo(centerX - 25, 70);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#2c3e50";
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(label, centerX, 365);
}

window.onload = renderPatient;
</script>

</body>
</html>
